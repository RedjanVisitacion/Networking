<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Networking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f9f9f9;
    }
    .quiz-box {
      max-width: 470px;
      margin: auto;
      padding: 20px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="quiz-box">
  <h2>Quiz for group 2</h2>
  <p>Enter your answer for number <span id="question-number">1</span>:</p>
  <input type="text" id="user-answer" placeholder="Type your answer here" />
  <button onclick="checkAnswer()">Submit</button>
  <div class="result" id="result-msg"></div>
</div>

<script>
  const answers = [
    "hostname",
    "enable secret",
    "description",
    "no shutdown",
    "show ip interfaces",
    "default gateway",
    "network",
    "service password encyption",
    "copy running-config startup-config",
    "show interfaces",
    "C",
    "B",
    "C",
    "C",
    "C"
  ];

  let current = 0;
  let score = 0;

  function checkAnswer() {
    const input = document.getElementById("user-answer").value.trim();
    const result = document.getElementById("result-msg");

    if (input.toLowerCase() === answers[current].toLowerCase()) {
      score++;
      result.textContent = "Correct!";
      result.style.color = "green";
    } else {
      result.textContent = `Incorrect! Correct answer: ${answers[current]}`;
      result.style.color = "red";
    }

    current++;

    if (current < answers.length) {
      document.getElementById("question-number").textContent = current + 1;
      document.getElementById("user-answer").value = "";
    } else {
      result.textContent += ` Quiz complete! Your score: ${score}/${answers.length}`;
      document.querySelector("input").disabled = true;
      document.querySelector("button").disabled = true;
    }
  }
</script>

</body>
  </html>
